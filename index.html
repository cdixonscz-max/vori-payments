<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Payments Savings Calculator</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet"/>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
    body{background:#F5F5F5;font-family:'Inter',sans-serif;color:#1A1A1A;}
    input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;}
    input[type=number]{-moz-appearance:textfield;}
    input::placeholder{color:#BBBBBB;}
    @keyframes spin{to{transform:rotate(360deg);}}
    @keyframes pop{0%{transform:scale(0.97);opacity:0;}100%{transform:scale(1);opacity:1;}}
    .pop{animation:pop 0.25s ease;}
  </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const {useState,useMemo,useRef,useEffect}=React;
const OR="#FF6D00";
const STORAGE_KEY="payments_analyzer_apikey";

const f$=v=>v==null||isNaN(v)?"—":new Intl.NumberFormat("en-US",{style:"currency",currency:"USD",minimumFractionDigits:0,maximumFractionDigits:0}).format(v);
const f$c=v=>v==null||isNaN(v)?"—":new Intl.NumberFormat("en-US",{style:"currency",currency:"USD",minimumFractionDigits:2}).format(v);
const fp=(v,d=2)=>(!v||isNaN(v)||!isFinite(v))?"—":`${Number(v).toFixed(d)}%`;
const n=v=>parseFloat(v)||0;

function rateColor(r){
  if(!r)return"#999";
  if(r<2.0)return"#16a34a";
  if(r<2.5)return"#65a30d";
  if(r<3.0)return"#d97706";
  if(r<3.8)return"#ea580c";
  return"#dc2626";
}
function rateLabel(r){
  if(!r)return"";
  if(r<2.0)return"Excellent";
  if(r<2.5)return"Good";
  if(r<3.0)return"Average";
  if(r<3.8)return"High — room to save";
  return"Very High — significant savings available";
}

async function toB64(file){
  return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result.split(",")[1]);r.onerror=rej;r.readAsDataURL(file);});
}

async function callClaude(apiKey, messages){
  const resp = await fetch("https://api.anthropic.com/v1/messages", {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      "x-api-key": apiKey,
      "anthropic-version": "2023-06-01",
      "anthropic-dangerous-direct-browser-access": "true"
    },
    body: JSON.stringify({ model: "claude-opus-4-5", max_tokens: 1024, messages })
  });
  if(!resp.ok){ const e=await resp.text(); throw new Error(e); }
  const data = await resp.json();
  const text = (data.content?.[0]?.text||"").replace(/```json|```/g,"").trim();
  try{ return JSON.parse(text); }
  catch(e){ throw new Error("Could not parse AI response: "+text.substring(0,200)); }
}

function Field({label,pre,suf,val,set,hint,large,placeholder,type="number"}){
  const[foc,setFoc]=useState(false);
  return(
    <div style={{marginBottom:"0.9rem"}}>
      {label&&<p style={{margin:"0 0 5px",fontSize:"0.72rem",fontWeight:600,color:"#666",textTransform:"uppercase",letterSpacing:"0.06em"}}>{label}</p>}
      <div style={{display:"flex",alignItems:"center",background:"#fff",border:`2px solid ${foc?OR:"#E0E0E0"}`,borderRadius:8,overflow:"hidden",transition:"border-color 0.15s",boxShadow:foc?`0 0 0 3px ${OR}20`:"none"}}>
        {pre&&<span style={{padding:"0 10px",color:"#999",fontSize:"0.9rem",fontWeight:500,borderRight:"1px solid #F0F0F0",background:"#FAFAFA",alignSelf:"stretch",display:"flex",alignItems:"center"}}>{pre}</span>}
        <input type={type} min="0" step="any" value={val} onChange={e=>set&&set(e.target.value)}
          onFocus={()=>setFoc(true)} onBlur={()=>setFoc(false)} placeholder={placeholder||"0"}
          style={{flex:1,background:"transparent",border:"none",outline:"none",color:"#1A1A1A",fontSize:large?"1.05rem":"0.95rem",fontFamily:type==="number"?"'DM Mono',monospace":"Inter,sans-serif",padding:large?"12px 14px":"10px 12px",fontWeight:large?600:400}}/>
        {suf&&<span style={{padding:"0 10px",color:"#999",fontSize:"0.9rem",borderLeft:"1px solid #F0F0F0",background:"#FAFAFA",alignSelf:"stretch",display:"flex",alignItems:"center"}}>{suf}</span>}
      </div>
      {hint&&<p style={{margin:"3px 0 0",fontSize:"0.7rem",color:"#AAA"}}>{hint}</p>}
    </div>
  );
}

function Card({children,style={}}){
  return <div style={{background:"#fff",border:"1px solid #E5E5E5",borderRadius:12,padding:"1.25rem",marginBottom:"1rem",...style}}>{children}</div>;
}

function STitle({children}){
  return <p style={{margin:"0 0 1rem",fontSize:"0.72rem",fontWeight:700,color:"#999",textTransform:"uppercase",letterSpacing:"0.08em",paddingBottom:"0.6rem",borderBottom:"1px solid #F0F0F0"}}>{children}</p>;
}

function App(){
  const[apiKey,setApiKey]=useState(()=>localStorage.getItem(STORAGE_KEY)||"");
  const[showKey,setShowKey]=useState(false);
  const[keyInput,setKeyInput]=useState("");

  const[vol,setVol]=useState("");
  const[txn,setTxn]=useState("");
  const[disc,setDisc]=useState("");
  const[txnf,setTxnf]=useState("");
  const[mnth,setMnth]=useState("");
  const[cb,setCb]=useState("");
  const[oth,setOth]=useState("");
  const[processor,setProcessor]=useState("");

  const[newRate,setNewRate]=useState("");
  const[newPer,setNewPer]=useState("");
  const[newMnth,setNewMnth]=useState("");

  const[loading,setLoading]=useState(false);
  const[err,setErr]=useState("");
  const[fname,setFname]=useState("");
  const[notes,setNotes]=useState("");
  const[drag,setDrag]=useState(false);
  const fileRef=useRef();

  const saveKey=()=>{
    localStorage.setItem(STORAGE_KEY,keyInput);
    setApiKey(keyInput);
    setShowKey(false);
    setKeyInput("");
  };

  const v=n(vol),t=n(txn);
  const totalFees=n(disc)+n(txnf)+n(mnth)+n(cb)+n(oth);
  const effectiveRate=v>0?(totalFees/v)*100:0;
  const costPerTxn=t>0?totalFees/t:0;
  const avgTicket=v>0&&t>0?v/t:0;

  const newMonthlyCost=useMemo(()=>{
    if(!v||!n(newRate))return null;
    return(v*n(newRate)/100)+(t*n(newPer))+n(newMnth);
  },[v,t,newRate,newPer,newMnth]);

  const newRateEff=newMonthlyCost&&v>0?(newMonthlyCost/v)*100:0;
  const monthlySavings=newMonthlyCost!=null?totalFees-newMonthlyCost:null;
  const annualSavings=monthlySavings!=null?monthlySavings*12:null;
  const saving=monthlySavings!=null&&monthlySavings>0;

  const applyResult=(r,fn)=>{
    setFname(fn);
    const getV=(...keys)=>{for(const k of keys){if(r[k]!=null&&r[k]!==0)return r[k];}return null;};
    const vol=getV("totalVolume","total_volume","volume","grossVolume","netSales","totalSales");
    const txn=getV("transactionCount","transaction_count","transactions","totalTransactions");
    const disc=getV("discountFees","discount_fees","discountAmount","interchange","interchangeFees");
    const txnf=getV("transactionFees","transaction_fees","perTransactionFees","authFees","perItemFees");
    const mnth=getV("monthlyFees","monthly_fees","fixedFees","statementFee","serviceFees");
    const cb=getV("chargebackFees","chargeback_fees","disputeFees");
    const oth=getV("otherFees","other_fees","miscFees");
    if(vol)setVol(String(Math.round(vol*100)/100));
    if(txn)setTxn(String(Math.round(txn)));
    if(disc)setDisc(String(Math.round(disc*100)/100));
    if(txnf)setTxnf(String(Math.round(txnf*100)/100));
    if(mnth)setMnth(String(Math.round(mnth*100)/100));
    if(cb)setCb(String(Math.round(cb*100)/100));
    if(oth)setOth(String(Math.round(oth*100)/100));
    if(r.notes)setNotes(r.notes);
  };

  const processFile=async(file)=>{
    if(!file)return;
    if(!apiKey){setErr("Please add your Anthropic API key first — click the 🔑 button in the top right.");return;}
    const isCSV=file.name.endsWith(".csv")||file.type==="text/csv";
    const isPDF=file.type==="application/pdf";
    const isImg=file.type.startsWith("image/");
    if(!isCSV&&!isPDF&&!isImg){setErr("Please upload a PDF (under 3.5mb), image screenshot, or CSV.");return;}
    setErr("");setLoading(true);setNotes("");
    try{
      let messages;
      const prompt=`You are an expert at reading FISERV, Square, Heartland, Clover merchant statements. Extract ALL fees and return ONLY valid JSON with no markdown:\n{"totalVolume":number,"transactionCount":number,"discountFees":number,"transactionFees":number,"monthlyFees":number,"chargebackFees":number,"otherFees":number,"notes":"brief summary"}\ntotalVolume = gross card sales volume (NOT fee amounts) — look for Net Sales, Total Sales, Total Volume\ntransactionCount = total number of transactions\ndiscountFees = all percentage-based fees (interchange, discount rate, assessments)\ntransactionFees = all per-transaction fees (auth fees, per-item fees)\nmonthlyFees = fixed monthly fees (statement, PCI, gateway)\nchargebackFees = chargeback and dispute fees\notherFees = any remaining fees`;
      if(isCSV){
        const csvText=await new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsText(file);});
        messages=[{role:"user",content:`${prompt}\n\nCSV DATA:\n${csvText.substring(0,8000)}`}];
      } else {
        if(isPDF&&file.size>3.5*1024*1024){setErr(`PDF is ${Math.round(file.size/1024/1024)}MB — too large. Press Command+Shift+4 to screenshot just the fees page, then upload that image.`);setLoading(false);return;}
        const b64=await toB64(file);
        const contentBlock=isPDF
          ?{type:"document",source:{type:"base64",media_type:"application/pdf",data:b64}}
          :{type:"image",source:{type:"base64",media_type:file.type,data:b64}};
        messages=[{role:"user",content:[contentBlock,{type:"text",text:prompt}]}];
      }
      const result=await callClaude(apiKey,messages);
      applyResult(result,file.name);
    }catch(e){
      if(e.message.includes("401")||e.message.includes("invalid_api_key")){
        setErr("Invalid API key — click 🔑 in the top right to update it.");
      } else if(e.message.includes("credit")||e.message.includes("billing")){
        setErr("Anthropic account out of credits — add credits at console.anthropic.com/settings/billing");
      } else {
        setErr("Error: "+e.message);
      }
    }
    finally{setLoading(false);}
  };

  const hasCurrent=totalFees>0&&v>0;
  const hasNew=newMonthlyCost!=null&&newMonthlyCost>0;

  return(
    <div style={{minHeight:"100vh",background:"#F5F5F5",paddingBottom:"3rem"}}>

      {/* NAV */}
      <div style={{background:OR,padding:"0 1.5rem",display:"flex",alignItems:"center",justifyContent:"space-between",height:60,position:"sticky",top:0,zIndex:100,boxShadow:"0 2px 12px rgba(255,109,0,0.35)"}}>
        <div style={{display:"flex",alignItems:"center",gap:10}}>
          <svg width="28" height="28" viewBox="0 0 28 28" fill="none">
            <circle cx="14" cy="14" r="12" fill="white" opacity="0.2"/>
            <path d="M14 7v14M10 10.5c0-1.5 1.5-2.5 4-2.5s4 1 4 2.5-1.5 2.5-4 2.5-4 1-4 2.5 1.5 2.5 4 2.5 4-1 4-2.5" stroke="white" strokeWidth="2" strokeLinecap="round" fill="none"/>
          </svg>
          <span style={{fontSize:"1.2rem",fontWeight:900,color:"#fff",letterSpacing:"-0.02em"}}>Payments Savings Calculator</span>
        </div>
        <div style={{display:"flex",alignItems:"center",gap:10}}>
          {saving&&(
            <div style={{background:"rgba(0,0,0,0.2)",borderRadius:8,padding:"5px 14px",display:"flex",alignItems:"center",gap:8}}>
              <span style={{fontSize:"0.75rem",color:"rgba(255,255,255,0.85)"}}>Monthly Savings</span>
              <span style={{fontSize:"1.05rem",fontWeight:900,fontFamily:"'DM Mono',monospace",color:"#fff"}}>{f$(monthlySavings)}</span>
            </div>
          )}
          <button onClick={()=>setShowKey(!showKey)} title="Set API Key"
            style={{background:"rgba(255,255,255,0.2)",border:"none",borderRadius:8,padding:"6px 12px",cursor:"pointer",color:"#fff",fontSize:"0.85rem",display:"flex",alignItems:"center",gap:5}}>
            🔑 {apiKey?"Key set":"Add key"}
          </button>
        </div>
      </div>

      {/* API KEY PANEL */}
      {showKey&&(
        <div style={{background:"#1A1A1A",padding:"1rem 1.5rem",display:"flex",alignItems:"center",gap:10}}>
          <span style={{fontSize:"0.8rem",color:"#AAA",whiteSpace:"nowrap"}}>Anthropic API Key:</span>
          <input type="password" value={keyInput} onChange={e=>setKeyInput(e.target.value)} placeholder="sk-ant-..."
            style={{flex:1,background:"#333",border:"1px solid #555",borderRadius:6,padding:"8px 12px",color:"#fff",fontSize:"0.85rem",fontFamily:"monospace"}}/>
          <button onClick={saveKey} style={{background:OR,border:"none",borderRadius:6,padding:"8px 16px",color:"#fff",fontWeight:700,cursor:"pointer",fontSize:"0.82rem"}}>Save</button>
          <button onClick={()=>setShowKey(false)} style={{background:"transparent",border:"1px solid #555",borderRadius:6,padding:"8px 12px",color:"#AAA",cursor:"pointer",fontSize:"0.82rem"}}>Cancel</button>
          <span style={{fontSize:"0.72rem",color:"#666"}}>Get key at console.anthropic.com/settings/keys · Saved in your browser only</span>
        </div>
      )}

      <div style={{maxWidth:1060,margin:"0 auto",padding:"1.75rem 1rem"}}>

        <div style={{marginBottom:"1.75rem"}}>
          <h1 style={{margin:0,fontSize:"clamp(1.4rem,3vw,2rem)",fontWeight:900,color:"#1A1A1A",letterSpacing:"-0.025em"}}>See How Much You Could Save</h1>
          <p style={{margin:"6px 0 0",fontSize:"0.9rem",color:"#777"}}>Upload your current merchant statement or enter fees manually — we'll calculate your exact savings.</p>
          {!apiKey&&<div style={{marginTop:"0.75rem",background:"#FFF4EE",border:`1px solid ${OR}50`,borderRadius:8,padding:"0.6rem 1rem",fontSize:"0.78rem",color:"#7C2D12"}}>
            👆 Click <strong>🔑 Add key</strong> in the top right to enable AI statement parsing — or enter fees manually below.
          </div>}
        </div>

        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"1.25rem",alignItems:"start"}}>

          {/* LEFT */}
          <div>
            <Card>
              <STitle>Step 1 — Current Processor Fees</STitle>

              {/* Upload */}
              <div onClick={()=>fileRef.current?.click()}
                onDrop={e=>{e.preventDefault();setDrag(false);processFile(e.dataTransfer.files[0]);}}
                onDragOver={e=>{e.preventDefault();setDrag(true);}} onDragLeave={()=>setDrag(false)}
                style={{border:`2px dashed ${drag?OR:loading?"#FFB87A":"#DDD"}`,borderRadius:10,padding:"1rem",textAlign:"center",background:drag?"#FFF4EE":"#FAFAFA",cursor:"pointer",marginBottom:"1rem",transition:"all 0.2s"}}>
                <input ref={fileRef} type="file" accept=".pdf,.csv,image/*" style={{display:"none"}} onChange={e=>processFile(e.target.files[0])}/>
                {loading?(
                  <div style={{display:"flex",alignItems:"center",justifyContent:"center",gap:8}}>
                    <div style={{width:18,height:18,border:"2px solid #FFD4A8",borderTop:`2px solid ${OR}`,borderRadius:"50%",animation:"spin 0.8s linear infinite"}}/>
                    <span style={{fontSize:"0.85rem",color:OR,fontWeight:600}}>AI reading your statement…</span>
                  </div>
                ):fname?(
                  <div>
                    <p style={{margin:0,fontSize:"0.85rem",color:OR,fontWeight:700}}>✅ {fname}</p>
                    <p style={{margin:"3px 0 0",fontSize:"0.72rem",color:"#AAA"}}>Click to upload a different file</p>
                  </div>
                ):(
                  <div>
                    <div style={{fontSize:"1.8rem",marginBottom:6}}>📄</div>
                    <p style={{margin:0,fontSize:"0.88rem",color:"#333",fontWeight:600}}>Upload Statement — AI fills fields automatically</p>
                    <p style={{margin:"4px 0 8px",fontSize:"0.75rem",color:"#AAA"}}>PDF (under 3.5mb), screenshot PNG/JPG, or CSV export</p>
                    <span style={{display:"inline-block",background:OR,color:"#fff",borderRadius:7,padding:"7px 18px",fontSize:"0.8rem",fontWeight:700}}>Choose File</span>
                  </div>
                )}
              </div>

              {err&&<div style={{background:"#FEF2F2",border:"1px solid #FCA5A5",borderRadius:8,padding:"0.7rem 1rem",marginBottom:"1rem",fontSize:"0.78rem",color:"#B91C1C",lineHeight:1.5}}>⚠️ {err}</div>}
              {notes&&<div style={{background:"#FFF4EE",border:`1px solid ${OR}40`,borderRadius:8,padding:"0.7rem 1rem",marginBottom:"1rem",fontSize:"0.78rem",color:"#7C2D12",lineHeight:1.5}}>🔥 <strong>AI Notes:</strong> {notes}</div>}

              <div style={{marginBottom:"0.75rem"}}>
                <p style={{margin:"0 0 5px",fontSize:"0.72rem",fontWeight:600,color:"#666",textTransform:"uppercase",letterSpacing:"0.06em"}}>Current Processor Name</p>
                <input type="text" value={processor} onChange={e=>setProcessor(e.target.value)} placeholder="e.g. FISERV, Square, Heartland"
                  style={{width:"100%",background:"#fff",border:"2px solid #E0E0E0",borderRadius:8,padding:"10px 12px",fontSize:"0.95rem",color:"#1A1A1A",fontFamily:"Inter,sans-serif",outline:"none"}}/>
              </div>

              <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"0 1rem"}}>
                <Field label="Monthly Card Volume" pre="$" val={vol} set={setVol} hint="Total gross card sales" large/>
                <Field label="# Transactions" val={txn} set={setTxn} hint="Total transaction count" large/>
              </div>

              {avgTicket>0&&<div style={{background:"#FFF4EE",borderRadius:7,padding:"8px 12px",marginBottom:"0.75rem",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                <span style={{fontSize:"0.78rem",color:"#888"}}>Average ticket size</span>
                <span style={{fontSize:"0.85rem",fontFamily:"'DM Mono',monospace",color:OR,fontWeight:700}}>{f$c(avgTicket)}</span>
              </div>}

              <p style={{margin:"0.5rem 0 0.6rem",fontSize:"0.72rem",fontWeight:700,color:"#999",textTransform:"uppercase",letterSpacing:"0.08em",paddingTop:"0.6rem",borderTop:"1px solid #F0F0F0"}}>Fee Breakdown</p>
              <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"0 1rem"}}>
                <Field label="Discount / Interchange" pre="$" val={disc} set={setDisc} hint="% of volume fees"/>
                <Field label="Per-Transaction Fees" pre="$" val={txnf} set={setTxnf} hint="Per-item / auth fees"/>
                <Field label="Monthly Fixed Fees" pre="$" val={mnth} set={setMnth} hint="Statement, PCI, gateway"/>
                <Field label="Chargeback Fees" pre="$" val={cb} set={setCb} hint="Dispute fees"/>
              </div>
              <Field label="Other Fees" pre="$" val={oth} set={setOth} hint="Any other charges"/>
            </Card>

            <Card>
              <STitle>Step 2 — New Processor.s Quoted Rate</STitle>
              <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"0 1rem"}}>
                <Field label="New Processor Rate %" suf="%" val={newRate} set={setNewRate} hint="e.g. 2.49" large placeholder="2.49"/>
                <Field label="New Per-Transaction" pre="$" val={newPer} set={setNewPer} hint="e.g. 0.15" placeholder="0.15"/>
              </div>
              <Field label="New Monthly Fees" pre="$" val={newMnth} set={setNewMnth} hint="Monthly fees (0 if included in rate)"/>
            </Card>
          </div>

          {/* RIGHT */}
          <div>
            {/* SAVINGS HERO */}
            {hasCurrent&&hasNew?(
              <div className="pop" style={{background:saving?OR:"#F0F0F0",borderRadius:16,padding:"1.5rem",marginBottom:"1rem",textAlign:"center",boxShadow:saving?"0 4px 24px rgba(255,109,0,0.4)":"none"}}>
                {saving?(
                  <>
                    <p style={{margin:0,fontSize:"0.8rem",fontWeight:700,color:"rgba(255,255,255,0.85)",textTransform:"uppercase",letterSpacing:"0.1em"}}>Monthly Savings</p>
                    <p style={{margin:"6px 0 2px",fontSize:"3.2rem",fontWeight:900,color:"#fff",fontFamily:"'DM Mono',monospace",lineHeight:1}}>{f$(monthlySavings)}</p>
                    <p style={{margin:0,fontSize:"1.05rem",color:"rgba(255,255,255,0.95)",fontWeight:600}}>{f$(annualSavings)} saved per year</p>
                    <div style={{marginTop:"1rem",background:"rgba(0,0,0,0.15)",borderRadius:10,padding:"0.8rem 1rem",display:"flex",justifyContent:"space-around"}}>
                      {[["Current Rate",fp(effectiveRate),"rgba(255,255,255,0.8)"],["→","","rgba(255,255,255,0.4)"],["New Rate",fp(newRateEff),"#fff"],["→","","rgba(255,255,255,0.4)"],["You Save","-"+fp(effectiveRate-newRateEff),"#fff"]].map(([l,v,c],i)=>(
                        <div key={i} style={{textAlign:"center"}}>
                          <p style={{margin:0,fontSize:"0.65rem",color:"rgba(255,255,255,0.7)"}}>{l}</p>
                          <p style={{margin:"2px 0 0",fontSize:l==="→"?"1.2rem":"1.05rem",fontWeight:700,fontFamily:"'DM Mono',monospace",color:c}}>{v}</p>
                        </div>
                      ))}
                    </div>
                  </>
                ):(
                  <>
                    <p style={{margin:0,fontSize:"0.9rem",fontWeight:700,color:"#555"}}>New rate costs more than current</p>
                    <p style={{margin:"4px 0 0",fontSize:"0.8rem",color:"#AAA"}}>Try adjusting the quoted rate or reviewing their current fees</p>
                  </>
                )}
              </div>
            ):(
              <div style={{background:"#fff",border:"2px dashed #E5E5E5",borderRadius:16,padding:"2.5rem 1.5rem",textAlign:"center",marginBottom:"1rem"}}>
                <div style={{fontSize:"2.5rem",marginBottom:"0.75rem"}}>💰</div>
                <p style={{margin:0,fontSize:"1rem",fontWeight:700,color:"#333"}}>Savings appear here</p>
                <p style={{margin:"6px 0 0",fontSize:"0.85rem",color:"#AAA",lineHeight:1.6}}>Enter the prospect's current fees and the new quoted rate to see exact monthly and annual savings.</p>
              </div>
            )}

            {/* Current processor summary */}
            {hasCurrent&&(
              <Card>
                <STitle>Current Processor — True Cost</STitle>
                <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"0.6rem",marginBottom:"0.75rem"}}>
                  <div style={{background:"#FAFAFA",borderRadius:10,padding:"1rem",border:"1px solid #F0F0F0"}}>
                    <p style={{margin:0,fontSize:"0.68rem",fontWeight:600,color:"#999",textTransform:"uppercase"}}>Effective Rate</p>
                    <p style={{margin:"4px 0 0",fontSize:"1.8rem",fontWeight:900,fontFamily:"'DM Mono',monospace",color:rateColor(effectiveRate),lineHeight:1}}>{fp(effectiveRate)}</p>
                    <p style={{margin:"3px 0 0",fontSize:"0.72rem",color:rateColor(effectiveRate),fontWeight:500}}>{rateLabel(effectiveRate)}</p>
                  </div>
                  <div style={{background:"#FAFAFA",borderRadius:10,padding:"1rem",border:"1px solid #F0F0F0"}}>
                    <p style={{margin:0,fontSize:"0.68rem",fontWeight:600,color:"#999",textTransform:"uppercase"}}>Monthly Fees</p>
                    <p style={{margin:"4px 0 0",fontSize:"1.8rem",fontWeight:900,fontFamily:"'DM Mono',monospace",color:"#1A1A1A",lineHeight:1}}>{f$(totalFees)}</p>
                    <p style={{margin:"3px 0 0",fontSize:"0.72rem",color:"#AAA"}}>{f$(totalFees*12)}/year</p>
                  </div>
                </div>
                <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:"0.5rem",marginBottom:"0.75rem"}}>
                  {[["Cost/Txn",costPerTxn>0?f$c(costPerTxn):"—"],["Volume",f$(v)],["Avg Ticket",avgTicket>0?f$c(avgTicket):"—"]].map(([l,val])=>(
                    <div key={l} style={{background:"#FAFAFA",borderRadius:8,padding:"0.65rem 0.75rem",border:"1px solid #F0F0F0"}}>
                      <p style={{margin:0,fontSize:"0.65rem",fontWeight:600,color:"#AAA",textTransform:"uppercase"}}>{l}</p>
                      <p style={{margin:"2px 0 0",fontSize:"0.9rem",fontWeight:700,fontFamily:"'DM Mono',monospace",color:"#333"}}>{val}</p>
                    </div>
                  ))}
                </div>
                {/* Fee bars */}
                {[["Discount/Interchange",n(disc),"#FF6D00"],["Per-Transaction",n(txnf),"#FB923C"],["Monthly Fixed",n(mnth),"#60A5FA"],["Chargebacks",n(cb),"#F472B6"],["Other",n(oth),"#94A3B8"]].filter(([,v])=>v>0).map(([label,val,color])=>{
                  const pct=totalFees>0?(val/totalFees)*100:0;
                  return(
                    <div key={label} style={{marginBottom:"0.55rem"}}>
                      <div style={{display:"flex",justifyContent:"space-between",marginBottom:2}}>
                        <span style={{fontSize:"0.75rem",color:"#555"}}>{label}</span>
                        <span style={{fontSize:"0.75rem",fontFamily:"'DM Mono',monospace",color:"#1A1A1A",fontWeight:500}}>{f$c(val)} <span style={{color:"#AAA",fontWeight:400}}>({pct.toFixed(0)}%)</span></span>
                      </div>
                      <div style={{height:6,background:"#F0F0F0",borderRadius:3}}>
                        <div style={{width:`${pct}%`,height:"100%",background:color,borderRadius:3,transition:"width 0.4s"}}/>
                      </div>
                    </div>
                  );
                })}
              </Card>
            )}

            {/* Comparison table */}
            {hasCurrent&&hasNew&&(
              <Card>
                <STitle>Side-by-Side Comparison</STitle>
                <table style={{width:"100%",borderCollapse:"collapse",fontSize:"0.82rem"}}>
                  <thead>
                    <tr>
                      <th style={{textAlign:"left",padding:"7px 8px",color:"#AAA",fontWeight:600,fontSize:"0.72rem",borderBottom:"2px solid #F0F0F0"}}></th>
                      <th style={{textAlign:"right",padding:"7px 8px",color:"#666",fontWeight:700,borderBottom:"2px solid #F0F0F0"}}>{processor||"Current"}</th>
                      <th style={{textAlign:"right",padding:"7px 8px",color:OR,fontWeight:700,borderBottom:"2px solid #F0F0F0"}}>New Processor</th>
                      <th style={{textAlign:"right",padding:"7px 8px",color:"#16a34a",fontWeight:700,borderBottom:"2px solid #F0F0F0"}}>Savings</th>
                    </tr>
                  </thead>
                  <tbody>
                    {[
                      ["Effective Rate",fp(effectiveRate),fp(newRateEff),saving?`-${fp(effectiveRate-newRateEff)}`:null,true],
                      ["Monthly Cost",f$c(totalFees),f$c(newMonthlyCost),saving?f$(monthlySavings):null,false],
                      ["Annual Cost",f$(totalFees*12),f$(newMonthlyCost*12),saving?f$(annualSavings):null,false],
                      ["Cost Per Txn",costPerTxn>0?f$c(costPerTxn):"—",t>0?f$c(newMonthlyCost/t):"—",null,false],
                    ].map(([label,curr,newVal,sav,bold],i)=>(
                      <tr key={label} style={{background:i%2===0?"#FAFAFA":"#fff"}}>
                        <td style={{padding:"8px",color:"#555",fontWeight:500}}>{label}</td>
                        <td style={{textAlign:"right",padding:"8px",fontFamily:"'DM Mono',monospace",color:"#666",fontWeight:bold?700:400}}>{curr}</td>
                        <td style={{textAlign:"right",padding:"8px",fontFamily:"'DM Mono',monospace",color:OR,fontWeight:bold?700:400}}>{newVal}</td>
                        <td style={{textAlign:"right",padding:"8px",fontFamily:"'DM Mono',monospace",color:"#16a34a",fontWeight:700}}>{sav||"—"}</td>
                      </tr>
                    ))}
                  </tbody>
                </table>
                {saving&&<div style={{marginTop:"0.75rem",background:"#F0FDF4",border:"1px solid #86EFAC",borderRadius:8,padding:"0.75rem 1rem",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                  <span style={{fontSize:"0.82rem",color:"#166534",fontWeight:600}}>🎉 Annual savings</span>
                  <span style={{fontFamily:"'DM Mono',monospace",fontWeight:900,fontSize:"1.2rem",color:"#16a34a"}}>{f$(annualSavings)}</span>
                </div>}
              </Card>
            )}

            {/* MCC benchmark */}
            {hasCurrent&&(
              <Card>
                <STitle>🍽️ MCC 5812 Industry Benchmark</STitle>
                <div style={{position:"relative",height:10,background:"#F0F0F0",borderRadius:5,marginBottom:8}}>
                  <div style={{position:"absolute",left:`${Math.min((2.5/6)*100,100)}%`,top:-3,width:3,height:16,background:"#F59E0B",borderRadius:2}}/>
                  <div style={{width:`${Math.min((effectiveRate/6)*100,100)}%`,height:"100%",background:rateColor(effectiveRate),borderRadius:5}}/>
                  {newRateEff>0&&<div style={{position:"absolute",left:`${Math.min((newRateEff/6)*100,100)}%`,top:-1,width:2,height:12,background:OR,borderRadius:1,opacity:0.7}}/>}
                </div>
                <div style={{display:"flex",justifyContent:"space-between",fontSize:"0.75rem",marginBottom:"0.75rem"}}>
                  <span style={{color:rateColor(effectiveRate),fontWeight:600}}>Current: {fp(effectiveRate)}</span>
                  {newRateEff>0&&<span style={{color:OR,fontWeight:600}}>New: {fp(newRateEff)}</span>}
                  <span style={{color:"#F59E0B",fontWeight:500}}>Restaurant avg: ~2.5%</span>
                </div>
                {effectiveRate>2.5&&<p style={{fontSize:"0.78rem",color:"#EA580C",fontWeight:500,marginBottom:"0.6rem"}}>⚠️ This prospect is paying {fp(effectiveRate-2.5)} above the restaurant industry average — {f$((effectiveRate-2.5)/100*v)}/mo above benchmark.</p>}
                <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"0.4rem"}}>
                  {[["Visa Consumer Credit","1.54–1.80%"],["Visa Debit (regulated)","0.05%+$0.21"],["MC Consumer Credit","1.58–1.73%"],["MC Debit (regulated)","0.05%+$0.21"]].map(([name,rate])=>(
                    <div key={name} style={{background:"#FAFAFA",borderRadius:7,padding:"0.5rem 0.7rem",border:"1px solid #F0F0F0"}}>
                      <div style={{fontSize:"0.7rem",fontWeight:600,color:"#555"}}>{name}</div>
                      <div style={{fontSize:"0.72rem",fontFamily:"'DM Mono',monospace",color:OR,marginTop:1}}>{rate}</div>
                    </div>
                  ))}
                </div>
              </Card>
            )}
          </div>
        </div>

        <p style={{textAlign:"center",marginTop:"1.5rem",fontSize:"0.68rem",color:"#CCC"}}>
          MCC 5812 · Payments Intelligence · Effective rate = total fees ÷ total volume
        </p>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
